name: deploy

# nn.typeshade.dev: the library's site (website/), built to website/dist and deployed to
# Cloudflare Workers on every push to `main` (wrangler.jsonc). Without the CLOUDFLARE_API_TOKEN
# secret the job says so and passes.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  cloudflare:
    name: cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: cloudflare
      url: https://nn.typeshade.dev/
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json
      - name: Build the TypeNN runtime
        run: npm ci && npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the dataset script's numpy
        run: pip install "numpy==2.*"
      - name: Restore the dataset downloads
        uses: actions/cache/restore@v4
        with:
          path: website/.dataset-cache
          # A cache entry cannot be overwritten, so each run saves under its own key and the
          # next run restores the newest entry by prefix. The key below never matches exactly.
          key: datasets-${{ hashFiles('website/scripts/fetch_datasets.py') }}-${{ github.run_id }}
          # The script checks every file's SHA-256, so an older cache is safe to restore.
          restore-keys: |
            datasets-${{ hashFiles('website/scripts/fetch_datasets.py') }}-
            datasets-
      - name: Mirror the datasets under website/public/data
        # The step ends before the job's timeout, so the save step below runs with a normal
        # (failed) status and the full time it needs, not as a cancellation cleanup.
        timeout-minutes: 70
        run: cd website && npm run datasets
      # Saved even when the step above fails or times out, so a partial download (.part) carries
      # over to the next run.
      - name: Save the dataset downloads
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: website/.dataset-cache
          key: datasets-${{ hashFiles('website/scripts/fetch_datasets.py') }}-${{ github.run_id }}
      - name: Build the site
        run: cd website && npm ci && npm run build
      - name: Deploy website/dist
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::No CLOUDFLARE_API_TOKEN secret; the site is not deployed."
            exit 0
          fi
          npx wrangler deploy
