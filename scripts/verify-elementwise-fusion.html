<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TypeNN WebGPU fusion verification</title>
  </head>
  <body>
    <pre id="result">Running explicit WebGPU verification…</pre>
    <script type="module">
      import { device } from "../dist/index.js";
      import {
        If,
        Return,
        builtin,
        compileModule,
        f32,
        f32T,
        fn,
        max,
        module,
        storageBuffer,
        u32T,
        uniformStruct,
        vec3uT,
        voidT,
      } from "typeshade";

      const result = document.querySelector("#result");
      try {
        result.textContent = "Requesting the WebGPU adapter…";
        if (!navigator.gpu)
          throw new Error("WebGPU is unavailable in this browser.");
        const adapter = await navigator.gpu.requestAdapter();
        if (!adapter)
          throw new Error("The browser did not provide a WebGPU adapter.");
        const adapterInfo = adapter.info;
        const isFallbackAdapter = adapter.isFallbackAdapter ?? "unavailable";
        result.textContent = "Opening TypeShade on the explicit WebGPU tier…";
        const fusedDeviceOpenStartedAt = performance.now();
        let gpu = await device({ device: "webgpu" });
        const coldFusedDeviceOpenMs =
          performance.now() - fusedDeviceOpenStartedAt;
        if (gpu.backend.name !== "webgpu") {
          throw new Error(
            `Expected WebGPU; TypeNN selected ${gpu.backend.name}.`,
          );
        }

        const a = gpu.tensor([1, 2, 3, 4], { shape: [4] });
        const b = gpu.tensor([5, -3, 2, -8], { shape: [4] });
        const c = gpu.tensor([2, 1, -2, 0.5], { shape: [4] });

        // Rebuild the fused compute entry with TypeShade's public IR builder so its CPU
        // interpreter is an oracle for the exact same elementwise formula and bindings.
        const oracleShape = uniformStruct(
          "Shape",
          { group: 0, binding: 0, as: "shape" },
          { length: u32T },
        );
        const oracleAddA = storageBuffer("addA", f32T, {
          group: 0,
          binding: 1,
          access: "read",
        });
        const oracleAddB = storageBuffer("addB", f32T, {
          group: 0,
          binding: 2,
          access: "read",
        });
        const oracleMultiplier = storageBuffer("multiplier", f32T, {
          group: 0,
          binding: 3,
          access: "read",
        });
        const oracleOutput = storageBuffer("output", f32T, {
          group: 0,
          binding: 4,
          access: "read_write",
        });
        const oracleKernel = fn(
          "addMulReluKernel",
          { gid: builtin("global_invocation_id", vec3uT) },
          voidT,
          ({ gid }) => {
            If(gid.x.ge(oracleShape.field.length), () => Return());
            const product = oracleAddA
              .at(gid.x)
              .add(oracleAddB.at(gid.x))
              .mul(oracleMultiplier.at(gid.x));
            oracleOutput.at(gid.x).assign(max(product, f32(0)));
          },
          { stage: "compute", workgroupSize: 64 },
        );
        const oracleModule = module({
          uses: [
            oracleShape,
            oracleAddA,
            oracleAddB,
            oracleMultiplier,
            oracleOutput,
          ],
          funcs: [oracleKernel],
        });
        const oracleCompileStartedAt = performance.now();
        const shadeOracle = compileModule(oracleModule, { precision: "f32" });
        const shadeOracleCompileMs = performance.now() - oracleCompileStartedAt;
        const shadeOracleOutput = new Float32Array(4);
        shadeOracle.setBinding("shape", { length: 4 });
        shadeOracle.setBinding("addA", new Float32Array([1, 2, 3, 4]));
        shadeOracle.setBinding("addB", new Float32Array([5, -3, 2, -8]));
        shadeOracle.setBinding("multiplier", new Float32Array([2, 1, -2, 0.5]));
        shadeOracle.setBinding("output", shadeOracleOutput);
        shadeOracle.dispatch("addMulReluKernel", [1, 1, 1]);
        const shadeOracleValues = [...shadeOracleOutput];

        const add = a.add(b);
        const product = add.mul(c);
        const output = product.relu();
        result.textContent = "Dispatching fused TypeShade compute…";
        const coldFirstFusedStartedAt = performance.now();
        const values = [...(await output.data())];
        const coldFirstFusedMaterializationMs =
          performance.now() - coldFirstFusedStartedAt;
        const decision = gpu.lastFusionDecision;
        if (values.some((value, index) => value !== [12, 0, 0, 0][index])) {
          throw new Error(`Unexpected output: ${JSON.stringify(values)}`);
        }
        if (decision?.status !== "fused" || decision.dispatches !== 1) {
          throw new Error(
            `Expected one fused dispatch; got ${JSON.stringify(decision)}.`,
          );
        }
        if (gpu.lastDispatchCount !== 1) {
          throw new Error(
            `Expected one executed dispatch; got ${gpu.lastDispatchCount}.`,
          );
        }
        const fusedDispatchCount = gpu.lastDispatchCount;
        const assertParity = (actual, expected, label) => {
          if (
            actual.length !== expected.length ||
            actual.some(
              (value, index) =>
                Math.abs(value - expected[index]) >
                1e-5 * Math.max(1, Math.abs(expected[index])),
            )
          ) {
            throw new Error(
              `${label} parity failed: ${JSON.stringify(actual)} vs ${JSON.stringify(expected)}.`,
            );
          }
        };
        result.textContent = "Checking later intermediate materialization…";
        const addValues = [...(await add.data())];
        const intermediateDispatchCount = gpu.lastDispatchCount;
        if (addValues.some((value, index) => value !== [6, -1, 5, -4][index])) {
          throw new Error(
            `Intermediate no longer evaluates correctly: ${addValues}`,
          );
        }
        const productValues = [...(await product.data())];
        const productDispatchCount = gpu.lastDispatchCount;
        if (
          productValues.some(
            (value, index) => value !== [12, -1, -10, -2][index],
          )
        ) {
          throw new Error(
            `Multiply intermediate no longer evaluates correctly: ${productValues}`,
          );
        }
        await gpu.dispose();
        const cpu = await device({ device: "cpu" });
        if (cpu.backend.name !== "cpu") {
          throw new Error(
            `Expected the CPU oracle device; got ${cpu.backend.name}.`,
          );
        }
        const cpuValues = [
          ...(await cpu
            .tensor([1, 2, 3, 4], { shape: [4] })
            .add(cpu.tensor([5, -3, 2, -8], { shape: [4] }))
            .mul(cpu.tensor([2, 1, -2, 0.5], { shape: [4] }))
            .relu()
            .data()),
        ];
        await cpu.dispose();
        assertParity(values, cpuValues, "TypeNN CPU");
        assertParity(values, shadeOracleValues, "TypeShade CPU");

        const unfusedDeviceOpenStartedAt = performance.now();
        gpu = await device({ device: "webgpu" });
        const coldUnfusedDeviceOpenMs =
          performance.now() - unfusedDeviceOpenStartedAt;
        if (gpu.backend.name !== "webgpu") {
          throw new Error(
            `Expected a fresh WebGPU device for the unfused path; got ${gpu.backend.name}.`,
          );
        }
        const coldUnfusedA = gpu.tensor([0, -1, 1, -2], { shape: [4] });
        const coldUnfusedB = gpu.tensor([2, 1, 2, 1], { shape: [4] });
        const coldUnfusedC = gpu.tensor([3, 3, 3, 3], { shape: [4] });
        const coldUnfusedSum = coldUnfusedA.add(coldUnfusedB);
        const branchWitness = coldUnfusedSum.neg();
        const coldUnfusedOutput = coldUnfusedSum.mul(coldUnfusedC).relu();
        const coldUnfusedStartedAt = performance.now();
        const coldUnfusedValues = [...(await coldUnfusedOutput.data())];
        const coldUnfusedFirstMaterializationMs =
          performance.now() - coldUnfusedStartedAt;
        const coldUnfusedDecision = gpu.lastFusionDecision;
        const coldUnfusedDispatchCount = gpu.lastDispatchCount;
        if (!branchWitness) throw new Error("The branch witness was lost.");
        assertParity(coldUnfusedValues, [6, 0, 9, 0], "Cold unfused TypeNN");
        if (
          coldUnfusedDecision?.status !== "refused" ||
          coldUnfusedDecision.code !== "observable-intermediate" ||
          coldUnfusedDispatchCount !== 3
        ) {
          throw new Error(
            `Expected a cold 3-dispatch refusal; got ${JSON.stringify({ coldUnfusedDecision, coldUnfusedDispatchCount })}.`,
          );
        }

        const benchmarkSize = 32_768;
        const benchmarkA = Float32Array.from(
          { length: benchmarkSize },
          (_, index) => (index % 4) - 2,
        );
        const benchmarkB = new Float32Array(benchmarkSize).fill(2);
        const benchmarkC = Float32Array.from(
          { length: benchmarkSize },
          (_, index) => (index % 2 === 0 ? 3 : -3),
        );
        async function sample(forceUnfused) {
          const left = gpu.tensor(benchmarkA, { shape: [benchmarkSize] });
          const right = gpu.tensor(benchmarkB, { shape: [benchmarkSize] });
          const scale = gpu.tensor(benchmarkC, { shape: [benchmarkSize] });
          const sum = left.add(right);
          const branch = forceUnfused ? sum.neg() : undefined;
          const value = sum.mul(scale).relu();
          const start = performance.now();
          const output = await value.data();
          if (
            [...output.slice(0, 4)].some(
              (item, index) => item !== [0, 0, 6, 0][index],
            )
          ) {
            throw new Error(
              `Unexpected benchmark output: ${[...output.slice(0, 4)]}`,
            );
          }
          return {
            milliseconds: performance.now() - start,
            dispatches: gpu.lastDispatchCount,
            decision: gpu.lastFusionDecision,
            branch,
          };
        }
        for (let index = 0; index < 2; index++) {
          await sample(false);
          await sample(true);
        }
        const fusedSamples = [];
        const unfusedSamples = [];
        for (let index = 0; index < 5; index++) {
          fusedSamples.push(await sample(false));
          unfusedSamples.push(await sample(true));
        }
        const median = (samples) =>
          samples
            .map((sample) => sample.milliseconds)
            .sort((left, right) => left - right)[
            Math.floor(samples.length / 2)
          ];
        if (
          fusedSamples.some((sample) => sample.dispatches !== 1) ||
          unfusedSamples.some(
            (sample) =>
              sample.dispatches !== 3 ||
              sample.decision?.status !== "refused" ||
              sample.decision.code !== "observable-intermediate",
          )
        ) {
          throw new Error("The benchmark did not exercise 1 vs. 3 dispatches.");
        }
        result.textContent = JSON.stringify(
          {
            status: "passed",
            backend: gpu.backend,
            adapter: {
              info: adapterInfo ?? "adapter details unavailable",
              isFallbackAdapter,
            },
            fusedDecision: decision,
            fusedDispatchCount,
            output: values,
            cpuParity: {
              typeNNCpu: cpuValues,
              typeShadeCpu: shadeOracleValues,
              tolerance: "relative 1e-5",
              typeShadeInterpreterCompileMs: shadeOracleCompileMs,
            },
            cold: {
              fused: {
                deviceOpenMs: coldFusedDeviceOpenMs,
                firstMaterializationMs: coldFirstFusedMaterializationMs,
                dispatches: fusedDispatchCount,
              },
              unfused: {
                freshDeviceOpenMs: coldUnfusedDeviceOpenMs,
                firstMaterializationMs: coldUnfusedFirstMaterializationMs,
                decision: coldUnfusedDecision,
                dispatches: coldUnfusedDispatchCount,
                output: coldUnfusedValues,
              },
              note: "Each path uses a fresh explicitly WebGPU TypeNN device. Device-open time includes TypeShade runtime setup and pipeline preparation; first materialization includes dispatch and readback. The public API does not expose isolated per-pipeline compilation time.",
            },
            laterIntermediateRead: addValues,
            intermediateDispatchCount,
            laterMultiplyIntermediateRead: productValues,
            multiplyIntermediateDispatchCount: productDispatchCount,
            benchmark: {
              shape: [benchmarkSize],
              warmupsPerPath: 2,
              samplesPerPath: 5,
              fusedMedianMs: median(fusedSamples),
              unfusedMedianMs: median(unfusedSamples),
              fusedDispatches: 1,
              unfusedDispatches: 3,
              note: "Warm materialization timings; browser/device timings are observational.",
            },
          },
          null,
          2,
        );
        await gpu.dispose();
      } catch (error) {
        result.textContent = JSON.stringify(
          { status: "failed", error: String(error) },
          null,
          2,
        );
        throw error;
      }
    </script>
  </body>
</html>
